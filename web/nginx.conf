# Replaces the image's default.conf: the same static site, plus one header.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Which web pod served this response ($hostname is the pod name in Kubernetes).
    # The lab console uses it to draw each visit landing on the pod that answered.
    add_header X-Pod $hostname always;

    location / {
        try_files $uri $uri/ =404;
    }
}
